[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "table-tennis-cv"
version = "0.1.0"
description = "PingPongVision: Ball Tracking & Table Bounce Analytics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scipy>=1.12",
    "Pillow>=10.3",
    "tqdm>=4.66",
    "pandas>=2.2",
    "streamlit>=1.32",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
models = [
    "ultralytics>=8.2",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
